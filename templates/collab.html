<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration - StudyRAG</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📚 StudyRAG</h2>
                <p id="username-display"></p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/chat" class="nav-item">
                    <span class="icon">💬</span> Chat
                </a>
                <a href="/practice" class="nav-item">
                    <span class="icon">✏️</span> Practice
                </a>
                <a href="/quiz" class="nav-item">
                    <span class="icon">📝</span> Quiz
                </a>
                <a href="/exam" class="nav-item">
                    <span class="icon">📚</span> Exam Preparation
                </a>
                <a href="/stats" class="nav-item">
                    <span class="icon">📊</span> Stats
                </a>
                <a href="/profile" class="nav-item">
                    <span class="icon">👤</span> Profile
                </a>
                <a href="/collab" class="nav-item active">
                    <span class="icon">🤝</span> Collaboration
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button id="darkModeToggle" class="btn btn-secondary btn-block" style="margin-bottom: 0.5rem;">
                    <span id="themeIcon">🌙</span> Dark Mode
                </button>
                <button id="logoutBtn" class="btn btn-secondary btn-block">Logout</button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <div class="collab-container">
                <div class="collab-header">
                    <h2>🤝 Collaboration</h2>
                    <p>Connect with other learners</p>
                </div>
                
                <div class="collab-tabs">
                    <button class="tab-btn active" data-tab="users">Users</button>
                    <button class="tab-btn" data-tab="groups">Study Groups</button>
                </div>
                
                <!-- Users Tab -->
                <div id="usersTab" class="tab-content active">
                    <div class="users-list" id="usersList"></div>
                </div>
                
                <!-- Groups Tab -->
                <div id="groupsTab" class="tab-content">
                    <button id="createGroupBtn" class="btn btn-primary">Create Study Group</button>
                    <div class="groups-list" id="groupsList"></div>
                </div>
                
                <!-- Group Chat View -->
                <div id="groupChatView" class="tab-content" style="display:none;">
                    <div class="chat-header">
                        <button id="backToGroupsBtn" class="btn btn-secondary">← Back</button>
                        <h3 id="chatGroupName"></h3>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Type a message...">
                        <button id="sendMessageBtn" class="btn btn-primary">Send</button>
                    </div>
                </div>
                
                <!-- Create Group Modal -->
                <div id="createGroupModal" class="modal" style="display:none;">
                    <div class="modal-content">
                        <span class="close">&times;</span>
                        <h3>Create Study Group</h3>
                        <form id="createGroupForm">
                            <div class="form-group">
                                <label for="groupTopic">Topic</label>
                                <input type="text" id="groupTopic" required>
                            </div>
                            <div class="form-group">
                                <label for="groupDescription">Description</label>
                                <textarea id="groupDescription" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Select Members</label>
                                <div id="membersList" class="members-list"></div>
                            </div>
                            <button type="submit" class="btn btn-primary">Create Group</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/main.js"></script>
    <script src="/static/js/collab.js"></script>
</body>
</html>
