<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StudyRAG</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <h1>📝 Register</h1>
            <p>Create your personalized learning profile</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age">
                    </div>
                    
                    <div class="form-group">
                        <label for="grade">Grade/Class</label>
                        <input type="text" id="grade" name="grade">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="favorite_topics">Favorite Topics</label>
                    <input type="text" id="favorite_topics" name="favorite_topics" placeholder="e.g., Math, Physics, Programming">
                </div>
                
                <div class="form-group">
                    <label for="weak_topics">Topics Needing Help</label>
                    <input type="text" id="weak_topics" name="weak_topics" placeholder="e.g., Chemistry, Statistics">
                </div>
                
                <div class="form-group">
                    <label for="learning_style">Learning Style</label>
                    <select id="learning_style" name="learning_style">
                        <option value="general">General</option>
                        <option value="visual">Visual</option>
                        <option value="auditory">Auditory</option>
                        <option value="hands-on">Hands-on</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="difficulty">Preferred Difficulty</label>
                    <select id="difficulty" name="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="goals">Learning Goals</label>
                    <textarea id="goals" name="goals" rows="3" placeholder="What do you want to achieve?"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
            
            <p class="auth-link">Already have an account? <a href="/login">Login here</a></p>
            
            <div id="error-message" class="error-message" style="display:none;"></div>
        </div>
    </div>
    
    <script src="/static/js/auth.js"></script>
</body>
</html>
